<!DOCTYPE html>
<html lang="ko" data-theme="basic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콘티 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ───────── 테마 ───────── */
:root, [data-theme="basic"] {
  --bg:#F4F5F7; --surface:#FFFFFF; --surface2:#FAFBFC; --line:#E2E5EA; --line2:#EEF0F3;
  --ink:#1B1D22; --ink2:#3F4652; --sub:#5F6672;
  --accent:#1F47C7; --accent-ink:#FFFFFF; --soft:#E6EDFD; --soft-ink:#1F47C7; --deco:#1F47C7;
  --dark:#1B1D22; --dark-ink:#FFFFFF;
  --r-card:12px; --r-ctl:8px; --r-chip:999px; --card-border:1px solid var(--line);
  --font-ui:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-text:'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --t-action-bg:#ECEEF2; --t-action:#3F4652;
  --t-dia-bg:#E6EDFD; --t-dia:#1F47C7;
  --t-nar-bg:#F0EAFB; --t-nar:#5B21B6;
  --t-sfx-bg:#FDEEE3; --t-sfx:#A2410B;
  --memo-bg:#FFF7DB; --memo-ink:#5C4300;
  --ok-bg:#E7F5EC; --ok:#146C2E; --warn-bg:#FDEEE3; --warn:#A2410B;
  --del-bg:#FDECEC; --del:#7F1717; --add-bg:#E7F5EC; --add:#0F5424;
  --focus:#1F47C7;
}
[data-theme="pink"] {
  --bg:#FFF5F7; --surface:#FFFFFF; --surface2:#FFFAFB; --line:#F7DCE4; --line2:#FBE9EE;
  --ink:#3A2E33; --ink2:#4A3E43; --sub:#7A6670;
  --accent:#FFB8CA; --accent-ink:#5A1A33; --soft:#FFE3EA; --soft-ink:#8A2C4E; --deco:#FF8FAB;
  --dark:#3A2E33; --dark-ink:#FFFFFF;
  --r-card:22px; --r-ctl:999px; --r-chip:999px; --card-border:1px solid transparent;
  --t-action-bg:#F6EFF1; --t-action:#4A3E43;
  --t-dia-bg:#DDEEFF; --t-dia:#1D4E89;
  --t-nar-bg:#F4F0FF; --t-nar:#4B2A9A;
  --t-sfx-bg:#FFE6D5; --t-sfx:#8A3A0B;
  --memo-bg:#FFF6C9; --memo-ink:#4A3A00;
  --ok-bg:#E6F6EE; --ok:#14532D; --warn-bg:#FFEFE3; --warn:#7A330A;
  --focus:#C2416B;
}

/* ───────── 기본 ───────── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); }
[hidden] { display: none !important; }

.btn { height: 40px; padding: 0 14px; border-radius: var(--r-ctl); border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface2); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.btn-primary:hover { background: var(--accent); filter: brightness(0.96); }
.btn-dark { background: var(--dark); color: var(--dark-ink); border-color: transparent; font-weight: 700; }
.btn-dark:hover { background: var(--dark); filter: brightness(1.15); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--line2); }
.btn-sm { height: 32px; padding: 0 10px; font-size: 12px; }
.btn-block { width: 100%; height: 44px; }
.btn-danger { color: #9F1D1D; }
.icon-btn { width: 32px; height: 32px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--sub); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:hover { background: var(--line2); color: var(--ink); }
.chip { height: 34px; padding: 0 14px; border-radius: var(--r-chip); border: 1px solid var(--line); background: var(--surface); color: var(--ink2); font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--dark); border-color: var(--dark); color: var(--dark-ink); }
[data-theme="pink"] .chip { border-color: transparent; }
[data-theme="pink"] .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.pill { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--line2); color: var(--sub); white-space: nowrap; }
.card { background: var(--surface); border: var(--card-border); border-radius: var(--r-card); }
.muted { color: var(--sub); }
.small { font-size: 12px; }
h1, h2, h3 { margin: 0; }

/* ───────── 상단 바 ───────── */
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
[data-theme="pink"] .topbar { background: var(--bg); border-bottom-color: transparent; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.logo-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--dark); color: var(--dark-ink); display: flex; align-items: center; justify-content: center; }
[data-theme="pink"] .logo-mark { background: var(--accent); color: var(--accent-ink); border-radius: 13px; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-ctl); background: var(--bg); }
[data-theme="pink"] .tabs { background: var(--surface); }
.tab { height: 36px; padding: 0 14px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--sub); font-size: 13px; font-weight: 500; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
[data-theme="pink"] .tab[aria-selected="true"] { background: var(--soft); color: var(--soft-ink); box-shadow: none; }
.search { flex: 1 1 180px; max-width: 300px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface2); }
[data-theme="pink"] .search { background: var(--surface); border-color: transparent; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ok); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.bad { color: #9F1D1D; }
.theme-switch { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--bg); }
[data-theme="pink"] .theme-switch { background: var(--surface); }
.theme-switch button { height: 32px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; font-size: 12px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
.theme-switch button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
[data-theme="pink"] .theme-switch button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.swatch { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.1); }
.top-actions { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 20px; background: var(--warn-bg); color: var(--warn); font-size: 13px; }
.banner strong { font-weight: 700; }
.banner .btn { height: 32px; }

/* ───────── 레이아웃 ───────── */
.layout { display: flex; flex-wrap: wrap; align-items: flex-start; min-height: calc(100vh - 61px); }
.sidebar { flex: 1 1 230px; max-width: 290px; align-self: stretch; padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 14px; }
[data-theme="pink"] .sidebar { background: transparent; border-right: 0; padding-right: 0; }
[data-theme="pink"] .sidebar-inner { background: var(--surface); border-radius: 24px; padding: 14px 10px; }
.sidebar-inner { display: flex; flex-direction: column; gap: 14px; }
.main { flex: 999 1 560px; min-width: 0; padding: 26px 30px 60px; display: flex; flex-direction: column; gap: 18px; }
.rail { flex: 1 1 290px; max-width: 360px; padding: 26px 22px 60px 0; display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 900px) {
  .sidebar { max-width: none; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail { max-width: none; padding: 0 16px 40px; }
  .main { padding: 20px 16px 40px; }
  .topbar { position: static; }
}

/* 사이드바 */
.side-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .04em; padding: 0 6px; }
.work-btn { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 8px; border: 0; border-radius: var(--r-ctl); background: transparent; text-align: left; font-weight: 700; }
.work-btn:hover { background: var(--line2); }
.work-btn .count { margin-left: auto; white-space: nowrap; font-size: 12px; font-weight: 400; color: var(--sub); }
.ep-list { display: flex; flex-direction: column; gap: 2px; }
.ep-btn { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 4px 10px 4px 28px; border: 0; border-radius: var(--r-ctl); background: transparent; text-align: left; color: var(--ink2); }
.ep-btn:hover { background: var(--line2); }
.ep-btn[aria-current="true"] { background: var(--soft); color: var(--ink); font-weight: 500; }
[data-theme="pink"] .ep-btn[aria-current="true"] { color: var(--soft-ink); font-weight: 700; }
.ep-btn span:first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ep-btn[aria-current="true"] .pill { background: var(--surface); color: var(--soft-ink); font-weight: 700; }
.dashed { border: 1.5px dashed var(--line); background: transparent; color: var(--sub); border-radius: var(--r-ctl); min-height: 40px; font-size: 13px; }
.dashed:hover { background: var(--line2); }
.side-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 2px; }
[data-theme="pink"] .side-foot { border-top-color: transparent; }
.side-link { display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 8px; border: 0; background: transparent; border-radius: var(--r-ctl); color: var(--ink2); font-size: 13px; text-align: left; }
.side-link:hover { background: var(--line2); }

/* 회차 머리 */
.ep-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.ep-head .meta { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink2); }
.ep-title { width: 100%; max-width: 640px; border: 0; background: transparent; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; padding: 2px 0; border-radius: 6px; font-family: var(--font-ui); }
[data-theme="pink"] .ep-title { font-family: var(--font-text); }
.ep-title:hover { background: var(--line2); }
.status-select { height: 30px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 0 10px; font-size: 12px; color: var(--ink2); }
.empty { padding: 40px 20px; text-align: center; color: var(--sub); border: 1.5px dashed var(--line); border-radius: var(--r-card); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* 페이지·컷 */
.page-head { display: flex; align-items: center; gap: 10px; }
.page-label { font-family: var(--font-mono); font-weight: 600; font-size: 15px; }
[data-theme="pink"] .page-label { font-family: var(--font-ui); font-weight: 400; font-size: 13px; padding: 3px 14px; border-radius: 999px; background: var(--soft); color: var(--soft-ink); }
.page-rule { flex: 1; height: 1px; background: var(--line); }
[data-theme="pink"] .page-rule { height: 0; border-top: 2px dotted var(--line); background: none; }
.cuts { display: flex; flex-direction: column; gap: 10px; }
.cut { display: grid; grid-template-columns: 104px minmax(0, 1fr); background: var(--surface); border: var(--card-border); border-radius: var(--r-card); overflow: hidden; contain: layout paint; }
.memo, .r-cut, .ver-item { contain: layout paint; }
.cut-side { padding: 14px; background: var(--surface2); border-right: 1px solid var(--line2); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
[data-theme="pink"] .cut-side { background: transparent; border-right: 0; }
.cut-no { font-family: var(--font-mono); font-size: 20px; font-weight: 600; line-height: 1; }
[data-theme="pink"] .cut-no { font-family: var(--font-ui); font-size: 13px; font-weight: 700; min-width: 44px; height: 28px; padding: 0 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; }
.shot { width: 100%; font-size: 12px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink2); }
[data-theme="pink"] .shot { border-radius: 999px; }
.cut-tools { display: flex; flex-wrap: wrap; gap: 0; margin-top: auto; }
.cut-tools .icon-btn { width: 28px; height: 28px; }
.cut-body { padding: 12px 14px 12px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ln { display: flex; align-items: flex-start; gap: 8px; }
.tag { flex: none; width: 70px; height: 26px; margin-top: 2px; border: 0; border-radius: 4px; font-size: 11px; font-weight: 700; text-align: center; text-align-last: center; appearance: none; -webkit-appearance: none; padding: 0 4px; cursor: pointer; }
[data-theme="pink"] .tag { border-radius: 999px; font-weight: 400; font-size: 12px; }
.tag-action { background: var(--t-action-bg); color: var(--t-action); }
.tag-dialogue { background: var(--t-dia-bg); color: var(--t-dia); }
.tag-narration { background: var(--t-nar-bg); color: var(--t-nar); }
.tag-sfx { background: var(--t-sfx-bg); color: var(--t-sfx); }
.speaker { flex: none; width: 78px; height: 30px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--t-dia); font-weight: 700; padding: 0 6px; font-size: 14px; }
.speaker:hover, .speaker:focus { border-color: var(--line); background: var(--surface); }
.ln-text { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 3px 6px; resize: none; overflow: hidden; font-family: var(--font-text); font-size: 15px; line-height: 1.6; min-height: 30px; }
.ln-text:hover, .ln-text:focus { border-color: var(--line); background: var(--surface); }
.ln-action .ln-text { color: var(--ink2); }
.ln-narration .ln-text { color: var(--t-nar); font-style: italic; }
.ln-sfx .ln-text { color: var(--t-sfx); font-weight: 700; letter-spacing: .02em; }
.ln-del { width: 28px; height: 28px; visibility: hidden; }
.ln:hover .ln-del, .ln:focus-within .ln-del { visibility: visible; }
.add-line { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 2px; visibility: hidden; }
/* 성능: 자리는 늘 잡아 두고(높이 변화 없음), 투명도 대신 visibility로 켜고 끔 → 마우스가 지나가도 레이아웃 재계산 없음 */
.cut:hover .add-line, .cut:focus-within .add-line, .cut.empty-cut .add-line { visibility: visible; }
@media (hover: none) { .add-line, .ln-del, .r-edit { visibility: visible !important; } }
.add-line button { height: 28px; padding: 0 10px; border: 1px dashed var(--line); border-radius: 999px; background: transparent; font-size: 12px; color: var(--sub); }
.add-line button:hover { background: var(--line2); color: var(--ink); }
.memo-box { display: flex; gap: 8px; align-items: flex-start; padding: 6px 10px; border-radius: 8px; background: var(--memo-bg); color: var(--memo-ink); }
[data-theme="pink"] .memo-box { border-radius: 16px 16px 16px 4px; }
.memo-box textarea { flex: 1; border: 0; background: transparent; resize: none; overflow: hidden; font-size: 13px; color: var(--memo-ink); padding: 2px 0; min-height: 24px; }
.add-cut { align-self: flex-start; }

.search-results { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.result { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; }
.result:hover { background: var(--line2); }
mark { background: #FFE58A; color: inherit; border-radius: 3px; padding: 0 1px; }

/* 오른쪽 패널 */
.panel { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
[data-theme="pink"] .panel { border-radius: 24px; }
.panel h2 { font-size: 15px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; }
.link-btn { border: 0; background: transparent; color: var(--soft-ink); font-size: 13px; font-weight: 500; padding: 4px 0; }
.link-btn:hover { text-decoration: underline; }
.state-row { display: flex; align-items: center; gap: 10px; }
.state-ic { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; font-weight: 700; }
.ver-mini { display: grid; grid-template-columns: 52px 10px minmax(0, 1fr); gap: 8px; padding: 6px 0; }
.ver-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; }
.export-btn { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; border: 1px solid var(--line2); border-radius: var(--r-ctl); background: var(--surface2); text-align: left; width: 100%; }
[data-theme="pink"] .export-btn { border-radius: 16px; border-color: transparent; background: var(--bg); }
.export-btn:hover { border-color: var(--line); }
.export-ext { width: 44px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--soft-ink); }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r-card); padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: transparent; width: 100%; color: var(--ink2); }
.drop:hover, .drop.over { background: var(--soft); border-color: var(--deco); }
body.dragging::after { content: '백업(.json)이나 원고(.txt, .pdf)를 놓으면 불러와요'; position: fixed; inset: 12px; border: 3px dashed var(--deco); border-radius: 20px; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--ink); z-index: 100; pointer-events: none; }

/* ───────── 글 화면 ───────── */
.write { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.paper { flex: 999 1 520px; min-width: 0; background: var(--surface); border: var(--card-border); border-radius: var(--r-card); padding: 22px 40px 28px; display: flex; flex-direction: column; }
[data-theme="pink"] .paper { border-radius: 28px; }
.write-tools { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 4px; border: 1px solid var(--line2); border-radius: 10px; margin-bottom: 26px; }
[data-theme="pink"] .write-tools { border: 0; gap: 6px; }
.write-tools button { height: 34px; padding: 0 11px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; color: var(--ink2); }
[data-theme="pink"] .write-tools button { border-radius: 999px; background: var(--bg); }
.write-tools button:hover { background: var(--line2); }
.write-tools .w-dia { color: var(--t-dia); font-weight: 700; }
.write-tools .w-nar { color: var(--t-nar); }
.write-tools .w-sfx { color: var(--t-sfx); }
[data-theme="pink"] .write-tools .w-dia { background: var(--t-dia-bg); font-weight: 400; }
[data-theme="pink"] .write-tools .w-nar { background: var(--t-nar-bg); }
[data-theme="pink"] .write-tools .w-sfx { background: var(--t-sfx-bg); }
/* 서식 편집기 */
.etool { position: sticky; top: 61px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 6px; margin: -6px -20px 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--line2); box-shadow: 0 2px 8px rgba(20,20,19,.04); }
[data-theme="pink"] .etool { border-radius: 18px; border-color: var(--line); }
.etool .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.eb { min-width: 30px; height: 32px; padding: 0 6px; border: 0; border-radius: 6px; background: transparent; color: var(--ink2); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
[data-theme="pink"] .eb { border-radius: 10px; }
.eb:hover { background: var(--line2); color: var(--ink); }
.eb[aria-pressed="true"] { background: var(--soft); color: var(--soft-ink); }
.eb:disabled { opacity: .35; cursor: default; }
.eb.w-dia { color: var(--t-dia); font-weight: 700; } .eb.w-nar { color: var(--t-nar); } .eb.w-sfx { color: var(--t-sfx); }

    else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push({ t: '-', s: a[i] }); i++; }
    else { out.push({ t: '+', s: b[j] }); j++; }
  }
  while (i < n) out.push({ t: '-', s: a[i++] });
  while (j < m) out.push({ t: '+', s: b[j++] });
  return out;
}

  var w = curWork(); if (!w) return;
  var input = $('#quick-text'), val = input.value.trim();
  if (!val) return;
  var p = parseMemoInput(val, $('#quick-kind').value);
  if (!p.text) { toast('태그 말고 내용도 적어 주세요'); return; }
  var col = $('#quick-col').value;
  S.memos.push({ id: uid(), text: p.text, kind: p.kind, speaker: p.speaker, tags: p.tags, workId: w.id, episodeId: col || null, pinned: false, created: Date.now() });
  changed(true);
  var ni = $('#quick-text'); if (ni) ni.focus();
  var qc = $('#quick-col'); if (qc) qc.value = col;
});

// 키보드
function isTextField(el) {
  if (!el) return false;
  if (el.isContentEditable) return true;
  var t = el.tagName;
  return t === 'TEXTAREA' || (t === 'INPUT' && !/^(checkbox|radio|button|submit|file|range|color)$/i.test(el.type)) || t === 'SELECT';
}
function editorKeys(e) {
  var mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase(), code = e.code;
  if (e.key === 'Enter' && !mod && !e.shiftKey && !e.altKey && foldedEnter()) return true;
  if (mod && !e.shiftKey && !e.altKey) {
    if (k === 'b') return runCmd('bold'), true;
    if (k === 'i') return runCmd('italic'), true;
    if (k === 'u') return runCmd('underline'), true;
    if (k === 'k') return runCmd('createLink'), true;
    if (k === 'y') return runCmd('redo'), true;
    if (k === '\\' || code === 'Backslash') return runCmd('removeFormat'), true;
    if (k === 'enter') return insertSyntax('cut'), true;
  }
  if (mod && e.shiftKey && !e.altKey) {
    if (k === 'x') return runCmd('strikeThrough'), true;
    if (k === 'h') return runCmd('hiliteColor', document.queryCommandValue('hiliteColor') && /255, 241, 168|fff1a8/i.test(document.queryCommandValue('hiliteColor')) ? 'transparent' : '#FFF1A8'), true;
    if (k === 'l') return runCmd('justifyLeft'), true;
    if (k === 'e') return runCmd('justifyCenter'), true;
    if (k === 'r') return runCmd('justifyRight'), true;
    if (code === 'Digit7') return runCmd('insertOrderedList'), true;
    if (code === 'Digit8') return runCmd('insertUnorderedList'), true;
    if (k === 'enter') return insertSyntax('page'), true;
  }
  if (mod && e.altKey && !e.shiftKey) {
    if (code === 'Digit1') return runCmd('formatBlock', 'h2'), true;
    if (code === 'Digit2') return runCmd('formatBlock', 'h3'), true;
    if (code === 'Digit0') return runCmd('formatBlock', 'div'), true;
  }
  if (!mod && !e.altKey && (e.key === '"' || e.key === "'") && vset().smartPunct) {
    var sel = window.getSelection(), prev = '';
    if (sel.rangeCount) { var r0 = sel.getRangeAt(0); if (r0.startContainer.nodeType === 3) prev = r0.startContainer.nodeValue.charAt(r0.startOffset - 1); }
    var open = !prev || /[\s(\[{“‘—-]/.test(prev);
    var q = e.key === '"' ? (open ? '“' : '”') : (open ? '‘' : '’');
    document.execCommand('insertText', false, q); afterEdit(); return true;
  }
  if (e.altKey && !mod && !e.shiftKey) {
    var map = { Digit1: 'dialogue', Digit2: 'narration', Digit3: 'sfx', Digit4: 'memo', Digit5: 'shot' };
    if (map[code]) return insertSyntax(map[code]), true;
  }
  return false;
}
document.addEventListener('keydown', function (e) {
  var mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
  if (e.isComposing || e.keyCode === 229) return; // 한글 조합 중에는 건드리지 않기
  if (mod && k === 's') { e.preventDefault(); saveNow(); addVersion('manual', (curEp() ? curEp().title + ' · ' : '') + hm(Date.now()) + ' 저장'); renderRail(); if (ui.view === 'backup') renderMain(); toast('버전을 남겼어요 (Ctrl+S)'); return; }
  if (mod && (k === '/' || e.code === 'Slash')) { e.preventDefault(); showKeys(); return; }
  if (e.target && e.target.id === 'draft') { if (editorKeys(e)) { e.preventDefault(); } return; }
  if (e.key === 'Escape' && ui.editingMemo) { ui.editingMemo = null; renderMain(); return; }
  if (e.key === 'Enter' && mod && e.target.dataset && e.target.dataset.memoEdit) { actions['memo-save']({ dataset: { id: e.target.dataset.memoEdit } }); return; }
  // 입력칸 밖에서는 앱 전체 실행 취소
  if (!isTextField(e.target) && mod && !e.altKey) {
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); appUndo(); return; }
    if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); appRedo(); return; }
  }
});
document.addEventListener('mousedown', function (e) {
  var sh = e.target.closest && e.target.closest('#draft > [data-k="story"]');
  if (sh && e.clientX < sh.getBoundingClientRect().left) {
    e.preventDefault();
    var si = -1; for (var c = sh; c; c = c.previousElementSibling) if (c.getAttribute('data-k') === 'story') si++;
    toggleFold(si); return;
  }
  // 툴바 버튼을 눌러도 편집기 선택 영역이 풀리지 않게
  if (e.target.closest('.etool button, .pop button')) e.preventDefault();
});
document.addEventListener('paste', function (e) {
  if (!e.target.closest || !e.target.closest('#draft')) return;
  var cd = e.clipboardData; if (!cd) return;
  var html = cd.getData('text/html'), text = cd.getData('text/plain');
  e.preventDefault();
  if (html) {
    var clean = sanitizeHtml(html.replace(/^[\s\S]*<!--StartFragment-->|<!--EndFragment-->[\s\S]*$/g, ''));
    document.execCommand('insertHTML', false, clean || esc(text));
  } else if (text) {
    document.execCommand('insertText', false, text);
  }
  afterEdit();
});

function showKeys() {
  var d = $('#keys');
  if (!d) {
    d = document.createElement('dialog'); d.id = 'keys'; d.className = 'keys';
    var rows = function (list) { return '<table class="kbd-table">' + list.map(function (r) { return '<tr><td>' + r[0].split(' + ').map(function (x) { return '<kbd>' + esc(x) + '</kbd>'; }).join(' + ') + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</table>'; };
    d.innerHTML = '<div class="keys-in"><div class="panel-head"><h2 style="font-size:18px">단축키</h2><button class="icon-btn" data-act="close-keys" aria-label="닫기">' + svg('x', 16) + '</button></div>' +
      '<p class="small muted" style="margin:0">Mac은 Ctrl 대신 ⌘(Command)를 눌러도 돼요.</p>' +
      '<div class="keys-grid"><div><h3 style="font-size:13px;margin:6px 0">글 서식</h3>' + rows([
        ['Ctrl + B', '굵게'], ['Ctrl + I', '기울임'], ['Ctrl + U', '밑줄'], ['Ctrl + Shift + X', '취소선'], ['Ctrl + Shift + H', '형광펜'],
        ['Ctrl + K', '링크'], ['Ctrl + \\', '서식 지우기'], ['Ctrl + Alt + 1', '이야기 제목'], ['Ctrl + Alt + 2', '소제목'], ['Ctrl + Alt + 0', '본문'],
        ['Ctrl + Shift + 8', '글머리 목록'], ['Ctrl + Shift + 7', '번호 목록'], ['Ctrl + Shift + L', '왼쪽 정렬'], ['Ctrl + Shift + E', '가운데 정렬'], ['Ctrl + Shift + R', '오른쪽 정렬']
      ]) + '</div><div><h3 style="font-size:13px;margin:6px 0">콘티 쓰기</h3>' + rows([
        ['Ctrl + Enter', '컷 나누기'], ['Ctrl + Shift + Enter', '페이지 나누기'], ['Alt + 1', '대사 (이름:)'], ['Alt + 2', '나레이션 (>)'], ['Alt + 3', '효과음 ( )'], ['Alt + 4', '메모 (//)'], ['Alt + 5', '샷 크기 [ ]']
      ]) + '<h3 style="font-size:13px;margin:12px 0 6px">전체</h3>' + rows([
        ['Ctrl + Z', '실행 취소'], ['Ctrl + Y', '다시 실행'], ['Ctrl + Shift + Z', '다시 실행'], ['Ctrl + S', '지금 상태를 버전으로'], ['Ctrl + /', '이 창 열기']
      ]) + '<p class="small muted" style="margin:8px 0 0">글 입력 중의 실행 취소는 그 글 안에서, 입력칸 밖에서는 컷 삭제·이동 같은 작업을 되돌려요.</p></div></div></div>';
    document.body.appendChild(d);
    d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-act="close-keys"]')) d.close(); });
  }
  if (d.open) d.close(); else if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

// 메모 끌어 옮기기
var dragMemo = null;
document.addEventListener('dragstart', function (e) {
  var m = e.target.closest && e.target.closest('[data-memo]');
  if (!m) return;
  dragMemo = m.dataset.memo; e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', 'memo:' + dragMemo); } catch (x) {}
});
document.addEventListener('dragend', function () { dragMemo = null; $all('.col.over').forEach(function (c) { c.classList.remove('over'); }); });

// 파일 끌어다 놓기 + 메모 칸 놓기
var dragDepth = 0;
function isFileDrag(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0; }
document.addEventListener('dragenter', function (e) { if (isFileDrag(e)) { dragDepth++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', function (e) { if (isFileDrag(e)) { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); } });
document.addEventListener('dragover', function (e) {
  if (isFileDrag(e)) { e.preventDefault(); return; }
  var col = e.target.closest && e.target.closest('.col');
  if (dragMemo && col) { e.preventDefault(); $all('.col.over').forEach(function (c) { if (c !== col) c.classList.remove('over'); }); col.classList.add('over'); }
});
document.addEventListener('drop', function (e) {
  if (isFileDrag(e)) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    var f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) importFile(f);
    return;
  }
  var col = e.target.closest && e.target.closest('.col');
  if (dragMemo && col) {
    e.preventDefault();
    var m = memoById(dragMemo); if (m) { m.episodeId = col.dataset.col || null; dragMemo = null; changed(true); }
  }
});

window.addEventListener('beforeunload', function () { if (saveTimer) saveNow(); });
setInterval(function () { renderStatus(); }, 60000);

/* ═════════ 시작 ═════════ */
(function init() {
  var raw = lsGet(LS_DATA);
  if (raw) { try { S = JSON.parse(raw); } catch (e) { S = null; } }
  var fresh = !S;
  if (fresh) S = seedData();
  normalize();
  var vr = lsGet(LS_VER);
  if (vr) { try { V = JSON.parse(vr) || []; } catch (e) { V = []; } }
  if (!Array.isArray(V)) V = [];
  hist.last = histStr();
  var lastAuto = V.find(function (v) { return v.type === 'auto'; });
  ui.lastAutoAt = lastAuto ? lastAuto.time : 0;
  if (fresh) { lsSet(LS_DATA, JSON.stringify(S)); ui.lastAutoAt = Date.now(); }
  // 저장 가능 여부 확인
  if (!lsSet('contiBox.test', '1')) storageOk = false;
  renderAll();
  if (!storageOk) toast('이 환경에선 브라우저 저장이 막혀 있어요. 꼭 파일로 백업해 주세요.');
})();

// 테스트용 노출
window.__conti = { get S() { return S; }, get V() { return V; }, ui: ui, parseDraft: parseDraft, sanitizeHtml: sanitizeHtml, htmlToText: htmlToText, hist: hist, episodeToText: episodeToText, actions: actions, saveNow: saveNow, addVersion: addVersion, renderAll: renderAll };
})();
</script>
